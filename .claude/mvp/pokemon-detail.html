<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>烈咬陆鲨 - Pokemon LocalDex</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    pokered: { DEFAULT: '#E63946', dark: '#C62833', light: 'rgba(230,57,70,0.08)' },
                    warm: { bg: '#FAF8F5', card: '#FFFCF8' },
                    ink: { DEFAULT: '#2D2D2D', muted: '#8A8A8A', faint: '#B5B5B5' },
                }
            }
        }
    }
    </script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
        .wechat-container { width: 393px; height: 852px; position: relative; overflow: hidden; }
        .capsule-button { background: rgba(255,255,255,0.25); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.35); }
        .capsule-divider { background: rgba(255,255,255,0.4); }
        .content-area { height: 808px; overflow-y: scroll; scroll-behavior: smooth; }
        .content-area::-webkit-scrollbar { display: none; }
        .glass-card {
            background: rgba(255, 252, 248, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
        }
        .type-tag {
            font-size: 11px; padding: 3px 10px; border-radius: 999px;
            color: white; font-weight: 500; letter-spacing: 0.5px;
        }
        .type-dragon { background: #7038F8; }
        .type-ground { background: #E0C068; }
        .type-fire { background: #F08030; }
        .type-flying { background: #A890F0; }
        .type-ghost { background: #705898; }
        .type-poison { background: #A040A0; }
        .type-fighting { background: #C03028; }
        .type-steel { background: #B8B8D0; }
        .type-normal { background: #A8A878; }

        .stat-bar { height: 8px; border-radius: 999px; transition: width 0.5s ease; }
        .stat-bg { height: 8px; border-radius: 999px; background: rgba(0,0,0,0.06); }

        .hero-bg {
            background: linear-gradient(160deg, #7038F8 0%, #8B60FA 30%, #E0C068 70%, #E8D090 100%);
            border-radius: 0 0 28px 28px;
        }
        .evo-arrow { color: #B5B5B5; }
        .evo-card-active { border: 2px solid #E63946; }
        .img-fallback {
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            color: rgba(255,255,255,0.4);
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="wechat-container mx-auto relative" style="background: #FAF8F5;">
        <!-- 状态栏 -->
        <div class="h-11 flex items-center justify-between px-4 relative z-10" style="background: linear-gradient(160deg, #7038F8, #8B60FA);">
            <div class="text-sm font-medium text-white">1:41</div>
            <div class="flex items-center gap-1 text-white">
                <div class="text-xs font-medium">5G</div>
                <div class="flex items-end gap-0.5 ml-1">
                    <div class="w-1 h-1 bg-white rounded-full"></div>
                    <div class="w-1 h-1.5 bg-white rounded-full"></div>
                    <div class="w-1 h-2 bg-white rounded-full"></div>
                    <div class="w-1 h-2.5 bg-white rounded-full"></div>
                </div>
                <div class="ml-1 flex items-center">
                    <div class="w-6 h-3 border border-white rounded-sm relative">
                        <div class="absolute inset-0.5 bg-white rounded-sm" style="width: 74%;"></div>
                    </div>
                    <div class="w-0.5 h-1.5 bg-white rounded-r-sm ml-0.5"></div>
                    <span class="text-xs ml-1">37</span>
                </div>
            </div>
        </div>

        <!-- 内容区域 -->
        <div class="relative content-area">
            <!-- Hero 区域 -->
            <div class="hero-bg relative pb-6" style="padding-top: 0;">
                <!-- 微信胶囊按钮 -->
                <div class="absolute right-3 top-1.5 flex capsule-button rounded-full h-7 z-20" style="width: 88px;">
                    <div class="flex-1 h-7 flex items-center justify-center">
                        <div class="flex gap-0.5">
                            <div class="w-1 h-1 bg-white rounded-full"></div>
                            <div class="w-1 h-1 bg-white rounded-full"></div>
                            <div class="w-1 h-1 bg-white rounded-full"></div>
                        </div>
                    </div>
                    <div class="w-px h-4 capsule-divider self-center"></div>
                    <div class="flex-1 h-7 flex items-center justify-center">
                        <div class="w-3.5 h-3.5 border border-white rounded-full"></div>
                    </div>
                </div>

                <!-- 导航栏 -->
                <div class="flex items-center h-10 px-4">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15 18l-6-6 6-6"/>
                    </svg>
                    <span class="text-white font-semibold text-base ml-2">烈咬陆鲨</span>
                </div>

                <!-- 装饰性半透明圆 -->
                <div class="absolute top-6 left-4 w-32 h-32 rounded-full" style="background: rgba(255,255,255,0.06);"></div>
                <div class="absolute top-24 right-8 w-20 h-20 rounded-full" style="background: rgba(255,255,255,0.04);"></div>

                <!-- 宝可梦大图 -->
                <div class="flex justify-center mt-2 mb-3 relative z-10">
                    <div class="w-48 h-48 flex items-center justify-center">
                        <img src="https://s1.52poke.wiki/wiki/thumb/f/fa/445Garchomp.png/300px-445Garchomp.png" alt="烈咬陆鲨" class="w-full h-full object-contain drop-shadow-lg" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                        <div class="img-fallback hidden">
                            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M2 12h8M14 12h8"/><circle cx="12" cy="12" r="3"/></svg>
                        </div>
                    </div>
                </div>

                <!-- 编号 + 名称 -->
                <div class="text-center relative z-10">
                    <div class="text-sm font-medium mb-1" style="color: rgba(255,255,255,0.6);">#0445</div>
                    <h2 class="text-xl font-bold text-white mb-0.5">烈咬陆鲨</h2>
                    <div class="text-sm mb-3" style="color: rgba(255,255,255,0.7);">Garchomp · ガブリアス</div>
                    <!-- 属性标签 -->
                    <div class="flex justify-center gap-2 mb-3">
                        <span class="type-tag type-dragon">龙</span>
                        <span class="type-tag type-ground">地面</span>
                    </div>
                    <!-- 分类信息 -->
                    <div class="text-xs" style="color: rgba(255,255,255,0.55);">
                        地鲨宝可梦 · 1.9m · 95.0kg
                    </div>
                </div>
            </div>

            <!-- 内容卡片区域 -->
            <div class="px-4 -mt-3 relative z-10 pb-8">

                <!-- 特性区域 -->
                <div class="glass-card rounded-2xl p-4 mb-3">
                    <h3 class="text-sm font-semibold mb-3" style="color: #2D2D2D;">特性</h3>
                    <div class="flex gap-2">
                        <!-- 特性1 -->
                        <div class="flex-1 rounded-xl p-3" style="background: rgba(0,0,0,0.03);">
                            <div class="text-sm font-semibold mb-1" style="color: #2D2D2D;">沙隐</div>
                            <div class="text-xs leading-relaxed" style="color: #8A8A8A;">沙暴天气时闪避率提升</div>
                        </div>
                        <!-- 特性2（隐藏） -->
                        <div class="flex-1 rounded-xl p-3 relative" style="background: rgba(0,0,0,0.03);">
                            <div class="absolute -top-1.5 right-2">
                                <span class="text-xs px-2 py-0.5 rounded-full font-medium" style="background: rgba(230,57,70,0.1); color: #E63946; font-size: 10px;">隐藏特性</span>
                            </div>
                            <div class="text-sm font-semibold mb-1" style="color: #2D2D2D;">粗糙皮肤</div>
                            <div class="text-xs leading-relaxed" style="color: #8A8A8A;">接触到该宝可梦的对手会受到伤害</div>
                        </div>
                    </div>
                </div>

                <!-- 种族值区域 -->
                <div class="glass-card rounded-2xl p-4 mb-3">
                    <div class="flex items-center justify-between mb-3">
                        <h3 class="text-sm font-semibold" style="color: #2D2D2D;">种族值</h3>
                        <span class="text-sm font-bold" style="color: #E63946;">合计 600</span>
                    </div>
                    <div class="space-y-2.5">
                        <!-- HP -->
                        <div class="flex items-center gap-2">
                            <span class="text-xs w-8 text-right font-medium" style="color: #8A8A8A;">HP</span>
                            <span class="text-xs w-7 text-right font-semibold" style="color: #2D2D2D;">108</span>
                            <div class="flex-1 stat-bg">
                                <div class="stat-bar" style="width: 42.4%; background: #F8D030;"></div>
                            </div>
                        </div>
                        <!-- 攻击 -->
                        <div class="flex items-center gap-2">
                            <span class="text-xs w-8 text-right font-medium" style="color: #8A8A8A;">攻击</span>
                            <span class="text-xs w-7 text-right font-semibold" style="color: #2D2D2D;">130</span>
                            <div class="flex-1 stat-bg">
                                <div class="stat-bar" style="width: 51.0%; background: #34C759;"></div>
                            </div>
                        </div>
                        <!-- 防御 -->
                        <div class="flex items-center gap-2">
                            <span class="text-xs w-8 text-right font-medium" style="color: #8A8A8A;">防御</span>
                            <span class="text-xs w-7 text-right font-semibold" style="color: #2D2D2D;">95</span>
                            <div class="flex-1 stat-bg">
                                <div class="stat-bar" style="width: 37.3%; background: #F8D030;"></div>
                            </div>
                        </div>
                        <!-- 特攻 -->
                        <div class="flex items-center gap-2">
                            <span class="text-xs w-8 text-right font-medium" style="color: #8A8A8A;">特攻</span>
                            <span class="text-xs w-7 text-right font-semibold" style="color: #2D2D2D;">80</span>
                            <div class="flex-1 stat-bg">
                                <div class="stat-bar" style="width: 31.4%; background: #FF9500;"></div>
                            </div>
                        </div>
                        <!-- 特防 -->
                        <div class="flex items-center gap-2">
                            <span class="text-xs w-8 text-right font-medium" style="color: #8A8A8A;">特防</span>
                            <span class="text-xs w-7 text-right font-semibold" style="color: #2D2D2D;">85</span>
                            <div class="flex-1 stat-bg">
                                <div class="stat-bar" style="width: 33.3%; background: #FF9500;"></div>
                            </div>
                        </div>
                        <!-- 速度 -->
                        <div class="flex items-center gap-2">
                            <span class="text-xs w-8 text-right font-medium" style="color: #8A8A8A;">速度</span>
                            <span class="text-xs w-7 text-right font-semibold" style="color: #2D2D2D;">102</span>
                            <div class="flex-1 stat-bg">
                                <div class="stat-bar" style="width: 40.0%; background: #F8D030;"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 进化链区域 -->
                <div class="glass-card rounded-2xl p-4 mb-3">
                    <h3 class="text-sm font-semibold mb-4" style="color: #2D2D2D;">进化链</h3>
                    <div class="flex items-center justify-between">
                        <!-- 圆陆鲨 -->
                        <div class="flex flex-col items-center flex-1">
                            <div class="w-16 h-16 rounded-xl flex items-center justify-center mb-1.5" style="background: rgba(0,0,0,0.03); border: 2px solid transparent;">
                                <img src="https://s1.52poke.wiki/wiki/thumb/b/b2/443Gible.png/120px-443Gible.png" alt="圆陆鲨" class="w-12 h-12 object-contain" onerror="this.style.display='none';">
                            </div>
                            <span class="text-xs font-medium" style="color: #2D2D2D;">圆陆鲨</span>
                            <span class="text-xs" style="color: #B5B5B5; font-size: 10px;">#0443</span>
                        </div>
                        <!-- 箭头 + 条件 -->
                        <div class="flex flex-col items-center mx-1">
                            <span class="text-xs font-medium mb-1" style="color: #E63946; font-size: 10px;">Lv.24</span>
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B5B5B5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M5 12h14M12 5l7 7-7 7"/>
                            </svg>
                        </div>
                        <!-- 尖牙陆鲨 -->
                        <div class="flex flex-col items-center flex-1">
                            <div class="w-16 h-16 rounded-xl flex items-center justify-center mb-1.5" style="background: rgba(0,0,0,0.03); border: 2px solid transparent;">
                                <img src="https://s1.52poke.wiki/wiki/thumb/b/b6/444Gabite.png/120px-444Gabite.png" alt="尖牙陆鲨" class="w-12 h-12 object-contain" onerror="this.style.display='none';">
                            </div>
                            <span class="text-xs font-medium" style="color: #2D2D2D;">尖牙陆鲨</span>
                            <span class="text-xs" style="color: #B5B5B5; font-size: 10px;">#0444</span>
                        </div>
                        <!-- 箭头 + 条件 -->
                        <div class="flex flex-col items-center mx-1">
                            <span class="text-xs font-medium mb-1" style="color: #E63946; font-size: 10px;">Lv.48</span>
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B5B5B5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M5 12h14M12 5l7 7-7 7"/>
                            </svg>
                        </div>
                        <!-- 烈咬陆鲨（当前，高亮） -->
                        <div class="flex flex-col items-center flex-1">
                            <div class="w-16 h-16 rounded-xl flex items-center justify-center mb-1.5 evo-card-active" style="background: rgba(230,57,70,0.05);">
                                <img src="https://s1.52poke.wiki/wiki/thumb/f/fa/445Garchomp.png/120px-445Garchomp.png" alt="烈咬陆鲨" class="w-12 h-12 object-contain" onerror="this.style.display='none';">
                            </div>
                            <span class="text-xs font-semibold" style="color: #E63946;">烈咬陆鲨</span>
                            <span class="text-xs" style="color: #B5B5B5; font-size: 10px;">#0445</span>
                        </div>
                    </div>
                </div>

                <!-- 招式表入口 -->
                <div class="glass-card rounded-2xl p-4 mb-3">
                    <div class="flex items-center justify-between mb-3">
                        <h3 class="text-sm font-semibold" style="color: #2D2D2D;">可学会招式</h3>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B5B5B5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 18l6-6-6-6"/>
                        </svg>
                    </div>
                    <!-- 代表性招式 -->
                    <div class="space-y-2">
                        <div class="flex items-center justify-between py-2 px-3 rounded-xl" style="background: rgba(0,0,0,0.02);">
                            <div class="flex items-center gap-2">
                                <div class="w-1 h-8 rounded-full" style="background: #E0C068;"></div>
                                <div>
                                    <div class="text-sm font-medium" style="color: #2D2D2D;">地震</div>
                                    <div class="flex gap-1 mt-0.5">
                                        <span class="type-tag type-ground" style="font-size: 9px; padding: 1px 6px;">地面</span>
                                        <span class="text-xs px-1.5 py-0.5 rounded-full font-medium" style="background: #F08030; color: white; font-size: 9px;">物理</span>
                                    </div>
                                </div>
                            </div>
                            <div class="text-right">
                                <div class="text-sm font-semibold" style="color: #2D2D2D;">100</div>
                                <div class="text-xs" style="color: #B5B5B5;">威力</div>
                            </div>
                        </div>
                        <div class="flex items-center justify-between py-2 px-3 rounded-xl" style="background: rgba(0,0,0,0.02);">
                            <div class="flex items-center gap-2">
                                <div class="w-1 h-8 rounded-full" style="background: #7038F8;"></div>
                                <div>
                                    <div class="text-sm font-medium" style="color: #2D2D2D;">逆鳞</div>
                                    <div class="flex gap-1 mt-0.5">
                                        <span class="type-tag type-dragon" style="font-size: 9px; padding: 1px 6px;">龙</span>
                                        <span class="text-xs px-1.5 py-0.5 rounded-full font-medium" style="background: #F08030; color: white; font-size: 9px;">物理</span>
                                    </div>
                                </div>
                            </div>
                            <div class="text-right">
                                <div class="text-sm font-semibold" style="color: #2D2D2D;">120</div>
                                <div class="text-xs" style="color: #B5B5B5;">威力</div>
                            </div>
                        </div>
                        <div class="flex items-center justify-between py-2 px-3 rounded-xl" style="background: rgba(0,0,0,0.02);">
                            <div class="flex items-center gap-2">
                                <div class="w-1 h-8 rounded-full" style="background: #A8A878;"></div>
                                <div>
                                    <div class="text-sm font-medium" style="color: #2D2D2D;">剑舞</div>
                                    <div class="flex gap-1 mt-0.5">
                                        <span class="type-tag type-normal" style="font-size: 9px; padding: 1px 6px;">一般</span>
                                        <span class="text-xs px-1.5 py-0.5 rounded-full font-medium" style="background: #8A8A8A; color: white; font-size: 9px;">变化</span>
                                    </div>
                                </div>
                            </div>
                            <div class="text-right">
                                <div class="text-sm font-semibold" style="color: #2D2D2D;">—</div>
                                <div class="text-xs" style="color: #B5B5B5;">威力</div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</body>
</html>
