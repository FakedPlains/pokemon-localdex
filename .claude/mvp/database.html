<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>资料库 - Pokemon LocalDex</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    pokered: { DEFAULT: '#E63946', dark: '#C62833', light: 'rgba(230,57,70,0.08)' },
                    warm: { bg: '#FAF8F5', card: '#FFFCF8', border: 'rgba(255,255,255,0.6)' },
                    ink: { DEFAULT: '#2D2D2D', muted: '#8A8A8A', faint: '#B5B5B5' },
                }
            }
        }
    }
    </script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
        .wechat-container { width: 393px; height: 852px; position: relative; overflow: hidden; }
        .capsule-button { background: rgba(0,0,0,0.08); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.2); }
        .capsule-divider { background: rgba(0,0,0,0.15); }
        .content-area { height: 808px; overflow-y: scroll; scroll-behavior: smooth; }
        .content-area::-webkit-scrollbar { display: none; }

        .glass-card {
            background: rgba(255, 252, 248, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
        }
        .type-tag {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 999px;
            color: white;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        .chip {
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            transition: all 0.2s;
            border: 1px solid rgba(0,0,0,0.06);
        }
        .chip-active {
            background: #E63946;
            color: white;
            border-color: #E63946;
            box-shadow: 0 2px 8px rgba(230,57,70,0.25);
        }
        .chip-inactive {
            background: rgba(255,252,248,0.85);
            color: #8A8A8A;
        }

        /* 属性颜色 */
        .type-grass { background: #78C850; }
        .type-poison { background: #A040A0; }
        .type-fire { background: #F08030; }
        .type-water { background: #6890F0; }
        .type-electric { background: #F8D030; color: #2D2D2D; }
        .type-flying { background: #A890F0; }
        .type-ghost { background: #705898; }
        .type-dragon { background: #7038F8; }
        .type-ground { background: #E0C068; }
        .type-psychic { background: #F85888; }
        .type-fighting { background: #C03028; }
        .type-steel { background: #B8B8D0; }
        .type-normal { background: #A8A878; }
        .type-ice { background: #98D8D8; }
        .type-rock { background: #B8A038; }
        .type-bug { background: #A8B820; }
        .type-dark { background: #705848; }
        .type-fairy { background: #EE99AC; }

        .tabbar-item { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; }
        .tabbar-item.active { color: #E63946; }
        .tabbar-item.inactive { color: #B5B5B5; }

        /* 筛选区滚动 */
        .filter-scroll { overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; }
        .filter-scroll::-webkit-scrollbar { display: none; }

        /* 顶部 Tab 分段控件 */
        .segment-container {
            background: rgba(0,0,0,0.04);
            border-radius: 999px;
            padding: 3px;
            display: inline-flex;
            gap: 2px;
        }
        .segment-item {
            padding: 6px 20px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .segment-active {
            background: #E63946;
            color: white;
            box-shadow: 0 2px 8px rgba(230,57,70,0.25);
        }
        .segment-inactive {
            color: #8A8A8A;
            background: transparent;
        }

        /* 招式卡片 */
        .move-card {
            position: relative;
            overflow: hidden;
            transition: transform 0.15s ease;
        }
        .move-card:active {
            transform: scale(0.98);
        }
        .move-card-border {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            border-radius: 16px 0 0 16px;
        }

        /* 分类图标 */
        .category-icon {
            width: 18px;
            height: 18px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            font-weight: 700;
            color: white;
        }
        .category-physical { background: linear-gradient(135deg, #E65C3A, #C74424); }
        .category-special { background: linear-gradient(135deg, #6E5BA8, #4F3D8E); }
        .category-status { background: linear-gradient(135deg, #9E9E9E, #757575); }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="wechat-container mx-auto relative" style="background: #FAF8F5;">
        <!-- 状态栏 -->
        <div class="h-11 flex items-center justify-between px-4 relative z-10" style="background: #FAF8F5;">
            <div class="text-sm font-medium" style="color: #2D2D2D;">1:41</div>
            <div class="flex items-center gap-1">
                <div class="text-xs font-medium" style="color: #2D2D2D;">5G</div>
                <div class="flex items-end gap-0.5 ml-1">
                    <div class="w-1 h-1 bg-current rounded-full" style="color: #2D2D2D;"></div>
                    <div class="w-1 h-1.5 bg-current rounded-full" style="color: #2D2D2D;"></div>
                    <div class="w-1 h-2 bg-current rounded-full" style="color: #2D2D2D;"></div>
                    <div class="w-1 h-2.5 bg-current rounded-full" style="color: #2D2D2D;"></div>
                </div>
                <div class="ml-1 flex items-center" style="color: #2D2D2D;">
                    <div class="w-6 h-3 border border-current rounded-sm relative">
                        <div class="absolute inset-0.5 bg-current rounded-sm" style="width: 74%;"></div>
                    </div>
                    <div class="w-0.5 h-1.5 bg-current rounded-r-sm ml-0.5"></div>
                    <span class="text-xs ml-1">37</span>
                </div>
            </div>
        </div>

        <!-- 内容区域 -->
        <div class="relative content-area" style="background: #FAF8F5;">
            <!-- 微信胶囊按钮 -->
            <div class="absolute right-3 top-1.5 flex capsule-button rounded-full h-7 z-20" style="width: 88px;">
                <div class="flex-1 h-7 flex items-center justify-center">
                    <div class="flex gap-0.5">
                        <div class="w-1 h-1 rounded-full" style="background: #2D2D2D;"></div>
                        <div class="w-1 h-1 rounded-full" style="background: #2D2D2D;"></div>
                        <div class="w-1 h-1 rounded-full" style="background: #2D2D2D;"></div>
                    </div>
                </div>
                <div class="w-px h-4 capsule-divider self-center"></div>
                <div class="flex-1 h-7 flex items-center justify-center">
                    <div class="w-3.5 h-3.5 border rounded-full" style="border-color: #2D2D2D;"></div>
                </div>
            </div>

            <!-- 自定义导航区 -->
            <div class="px-4 pt-1 pb-3">
                <div class="flex items-center justify-between h-10">
                    <h1 class="text-xl font-bold" style="color: #2D2D2D;">资料库</h1>
                </div>
            </div>

            <!-- 顶部 Tab 分段控件 -->
            <div class="px-4 pb-3 flex justify-center">
                <div class="segment-container">
                    <div class="segment-item segment-active">招式</div>
                    <div class="segment-item segment-inactive">特性</div>
                    <div class="segment-item segment-inactive">道具</div>
                </div>
            </div>

            <!-- 搜索栏 -->
            <div class="px-4 pb-3">
                <div class="flex items-center gap-2.5 px-4 py-2.5 rounded-full" style="background: rgba(0,0,0,0.04);">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B5B5B5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle><path d="M21 21l-4.35-4.35"></path>
                    </svg>
                    <span class="text-sm" style="color: #B5B5B5;">搜索招式名称</span>
                </div>
            </div>

            <!-- 分类筛选 -->
            <div class="filter-scroll px-4 pb-2 flex gap-2">
                <div class="chip chip-active">全部</div>
                <div class="chip chip-inactive">物理</div>
                <div class="chip chip-inactive">特殊</div>
                <div class="chip chip-inactive">变化</div>
            </div>

            <!-- 属性筛选 -->
            <div class="filter-scroll px-4 pb-4 flex gap-1.5">
                <div class="type-tag type-normal" style="padding: 4px 10px; font-size: 11px; opacity: 0.55;">一般</div>
                <div class="type-tag type-fire" style="padding: 4px 10px; font-size: 11px; opacity: 0.55;">火</div>
                <div class="type-tag type-water" style="padding: 4px 10px; font-size: 11px; opacity: 0.55;">水</div>
                <div class="type-tag type-grass" style="padding: 4px 10px; font-size: 11px; opacity: 0.55;">草</div>
                <div class="type-tag type-electric" style="padding: 4px 10px; font-size: 11px; opacity: 0.55;">电</div>
                <div class="type-tag type-ice" style="padding: 4px 10px; font-size: 11px; opacity: 0.55;">冰</div>
                <div class="type-tag type-fighting" style="padding: 4px 10px; font-size: 11px; opacity: 0.55;">格斗</div>
                <div class="type-tag type-poison" style="padding: 4px 10px; font-size: 11px; opacity: 0.55;">毒</div>
                <div class="type-tag type-ground" style="padding: 4px 10px; font-size: 11px; opacity: 0.55;">地面</div>
                <div class="type-tag type-flying" style="padding: 4px 10px; font-size: 11px; opacity: 0.55;">飞行</div>
                <div class="type-tag type-psychic" style="padding: 4px 10px; font-size: 11px; opacity: 0.55;">超能力</div>
                <div class="type-tag type-bug" style="padding: 4px 10px; font-size: 11px; opacity: 0.55;">虫</div>
                <div class="type-tag type-rock" style="padding: 4px 10px; font-size: 11px; opacity: 0.55;">岩石</div>
                <div class="type-tag type-ghost" style="padding: 4px 10px; font-size: 11px; opacity: 0.55;">幽灵</div>
                <div class="type-tag type-dragon" style="padding: 4px 10px; font-size: 11px; opacity: 0.55;">龙</div>
                <div class="type-tag type-dark" style="padding: 4px 10px; font-size: 11px; opacity: 0.55;">恶</div>
                <div class="type-tag type-steel" style="padding: 4px 10px; font-size: 11px; opacity: 0.55;">钢</div>
                <div class="type-tag type-fairy" style="padding: 4px 10px; font-size: 11px; opacity: 0.55;">妖精</div>
            </div>

            <!-- 招式列表 -->
            <div class="px-4 flex flex-col gap-3 pb-24">

                <!-- 招式1：地震 -->
                <div class="move-card glass-card rounded-2xl p-3 pl-5 flex items-center justify-between">
                    <div class="move-card-border" style="background: #E0C068;"></div>
                    <div class="flex flex-col gap-1.5">
                        <div class="flex items-center gap-2">
                            <span class="text-sm font-bold" style="color: #2D2D2D;">地震</span>
                            <span class="type-tag type-ground">地面</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="category-icon category-physical">物</div>
                        <div class="flex items-center gap-2 text-xs" style="color: #8A8A8A;">
                            <div class="flex flex-col items-center">
                                <span class="font-semibold" style="color: #2D2D2D;">100</span>
                                <span style="font-size: 9px; color: #B5B5B5;">威力</span>
                            </div>
                            <div class="flex flex-col items-center">
                                <span class="font-semibold" style="color: #2D2D2D;">100</span>
                                <span style="font-size: 9px; color: #B5B5B5;">命中</span>
                            </div>
                            <div class="flex flex-col items-center">
                                <span class="font-semibold" style="color: #2D2D2D;">10</span>
                                <span style="font-size: 9px; color: #B5B5B5;">PP</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 招式2：十万伏特 -->
                <div class="move-card glass-card rounded-2xl p-3 pl-5 flex items-center justify-between">
                    <div class="move-card-border" style="background: #F8D030;"></div>
                    <div class="flex flex-col gap-1.5">
                        <div class="flex items-center gap-2">
                            <span class="text-sm font-bold" style="color: #2D2D2D;">十万伏特</span>
                            <span class="type-tag type-electric">电</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="category-icon category-special">特</div>
                        <div class="flex items-center gap-2 text-xs" style="color: #8A8A8A;">
                            <div class="flex flex-col items-center">
                                <span class="font-semibold" style="color: #2D2D2D;">90</span>
                                <span style="font-size: 9px; color: #B5B5B5;">威力</span>
                            </div>
                            <div class="flex flex-col items-center">
                                <span class="font-semibold" style="color: #2D2D2D;">100</span>
                                <span style="font-size: 9px; color: #B5B5B5;">命中</span>
                            </div>
                            <div class="flex flex-col items-center">
                                <span class="font-semibold" style="color: #2D2D2D;">15</span>
                                <span style="font-size: 9px; color: #B5B5B5;">PP</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 招式3：冲浪 -->
                <div class="move-card glass-card rounded-2xl p-3 pl-5 flex items-center justify-between">
                    <div class="move-card-border" style="background: #6890F0;"></div>
                    <div class="flex flex-col gap-1.5">
                        <div class="flex items-center gap-2">
                            <span class="text-sm font-bold" style="color: #2D2D2D;">冲浪</span>
                            <span class="type-tag type-water">水</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="category-icon category-special">特</div>
                        <div class="flex items-center gap-2 text-xs" style="color: #8A8A8A;">
                            <div class="flex flex-col items-center">
                                <span class="font-semibold" style="color: #2D2D2D;">90</span>
                                <span style="font-size: 9px; color: #B5B5B5;">威力</span>
                            </div>
                            <div class="flex flex-col items-center">
                                <span class="font-semibold" style="color: #2D2D2D;">100</span>
                                <span style="font-size: 9px; color: #B5B5B5;">命中</span>
                            </div>
                            <div class="flex flex-col items-center">
                                <span class="font-semibold" style="color: #2D2D2D;">15</span>
                                <span style="font-size: 9px; color: #B5B5B5;">PP</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 招式4：剑舞 -->
                <div class="move-card glass-card rounded-2xl p-3 pl-5 flex items-center justify-between">
                    <div class="move-card-border" style="background: #A8A878;"></div>
                    <div class="flex flex-col gap-1.5">
                        <div class="flex items-center gap-2">
                            <span class="text-sm font-bold" style="color: #2D2D2D;">剑舞</span>
                            <span class="type-tag type-normal">一般</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="category-icon category-status">变</div>
                        <div class="flex items-center gap-2 text-xs" style="color: #8A8A8A;">
                            <div class="flex flex-col items-center">
                                <span class="font-semibold" style="color: #B5B5B5;">—</span>
                                <span style="font-size: 9px; color: #B5B5B5;">威力</span>
                            </div>
                            <div class="flex flex-col items-center">
                                <span class="font-semibold" style="color: #B5B5B5;">—</span>
                                <span style="font-size: 9px; color: #B5B5B5;">命中</span>
                            </div>
                            <div class="flex flex-col items-center">
                                <span class="font-semibold" style="color: #2D2D2D;">20</span>
                                <span style="font-size: 9px; color: #B5B5B5;">PP</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 招式5：火焰放射 -->
                <div class="move-card glass-card rounded-2xl p-3 pl-5 flex items-center justify-between">
                    <div class="move-card-border" style="background: #F08030;"></div>
                    <div class="flex flex-col gap-1.5">
                        <div class="flex items-center gap-2">
                            <span class="text-sm font-bold" style="color: #2D2D2D;">火焰放射</span>
                            <span class="type-tag type-fire">火</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="category-icon category-special">特</div>
                        <div class="flex items-center gap-2 text-xs" style="color: #8A8A8A;">
                            <div class="flex flex-col items-center">
                                <span class="font-semibold" style="color: #2D2D2D;">90</span>
                                <span style="font-size: 9px; color: #B5B5B5;">威力</span>
                            </div>
                            <div class="flex flex-col items-center">
                                <span class="font-semibold" style="color: #2D2D2D;">100</span>
                                <span style="font-size: 9px; color: #B5B5B5;">命中</span>
                            </div>
                            <div class="flex flex-col items-center">
                                <span class="font-semibold" style="color: #2D2D2D;">15</span>
                                <span style="font-size: 9px; color: #B5B5B5;">PP</span>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <!-- 底部 TabBar -->
        <div class="absolute bottom-0 left-0 right-0 flex items-end justify-around px-6 pb-5 pt-2 z-30" style="background: rgba(255,252,248,0.92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid rgba(0,0,0,0.04);">
            <!-- 图鉴 (inactive) -->
            <div class="tabbar-item inactive">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/><path d="M2 12h8M14 12h8"/><circle cx="12" cy="12" r="3"/>
                </svg>
                <span>图鉴</span>
            </div>
            <!-- 资料库 (active) -->
            <div class="tabbar-item active">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
                </svg>
                <span>资料库</span>
            </div>
            <!-- 队伍 (inactive) -->
            <div class="tabbar-item inactive">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                </svg>
                <span>队伍</span>
            </div>
            <!-- 我的 (inactive) -->
            <div class="tabbar-item inactive">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                </svg>
                <span>我的</span>
            </div>
        </div>
    </div>
</body>
</html>
