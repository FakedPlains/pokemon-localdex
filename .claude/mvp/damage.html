<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>伤害计算 - Pokemon LocalDex</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    pokered: { DEFAULT: '#E63946', dark: '#C62833', light: 'rgba(230,57,70,0.08)' },
                    warm: { bg: '#FAF8F5', card: '#FFFCF8', border: 'rgba(255,255,255,0.6)' },
                    ink: { DEFAULT: '#2D2D2D', muted: '#8A8A8A', faint: '#B5B5B5' },
                    pokeblue: { DEFAULT: '#6890F0' },
                }
            }
        }
    }
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
        .wechat-container { width: 393px; height: 852px; position: relative; overflow: hidden; }
        .content-area { height: 808px; overflow-y: scroll; scroll-behavior: smooth; }
        .content-area::-webkit-scrollbar { display: none; }

        .capsule-button { background: rgba(0,0,0,0.08); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.2); }
        .capsule-divider { background: rgba(0,0,0,0.15); }

        .glass-card {
            background: rgba(255, 252, 248, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
            border-radius: 16px;
        }

        .type-tag {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 999px;
            color: white;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .chip {
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
            border: 1px solid rgba(0,0,0,0.06);
        }
        .chip-active {
            background: #E63946;
            color: white;
            border-color: #E63946;
            box-shadow: 0 2px 8px rgba(230,57,70,0.25);
        }
        .chip-inactive {
            background: rgba(255,252,248,0.85);
            color: #8A8A8A;
        }

        /* 属性颜色 */
        .type-dragon { background: #7038F8; }
        .type-ground { background: #E0C068; color: #2D2D2D; }
        .type-electric { background: #F8D030; color: #2D2D2D; }
        .type-fire { background: #F08030; }
        .type-normal { background: #A8A878; }

        /* 分段控件 */
        .segment-control {
            display: flex;
            background: rgba(0,0,0,0.04);
            border-radius: 999px;
            padding: 2px;
        }
        .segment-item {
            padding: 4px 14px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 500;
            color: #8A8A8A;
            transition: all 0.2s;
            cursor: pointer;
        }
        .segment-item.active {
            background: #E63946;
            color: white;
            box-shadow: 0 1px 4px rgba(230,57,70,0.3);
        }

        /* 配置标签 */
        .config-tag {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 11px;
            color: #2D2D2D;
            background: rgba(0,0,0,0.03);
            gap: 4px;
        }
        .config-tag .label {
            color: #8A8A8A;
            font-size: 10px;
        }

        /* 招式槽位 */
        .move-slot {
            display: flex;
            align-items: center;
            padding: 7px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 500;
            background: rgba(0,0,0,0.03);
            color: #2D2D2D;
            border: 1.5px solid transparent;
            transition: all 0.2s;
        }
        .move-slot.active {
            background: rgba(224, 192, 104, 0.10);
            border-color: #E0C068;
            box-shadow: 0 0 0 1px rgba(224,192,104,0.15);
        }
        .move-slot .move-type-bar {
            width: 3px;
            height: 14px;
            border-radius: 2px;
            margin-right: 8px;
            flex-shrink: 0;
        }

        /* 结果区域 */
        .result-card {
            background: linear-gradient(135deg, rgba(230,57,70,0.06) 0%, rgba(230,57,70,0.02) 100%);
            border: 1.5px solid rgba(230,57,70,0.15);
            border-radius: 16px;
            overflow: hidden;
        }
        .result-bar-track {
            height: 8px;
            border-radius: 999px;
            background: rgba(0,0,0,0.04);
            overflow: hidden;
            position: relative;
        }
        .result-bar-fill {
            height: 100%;
            border-radius: 999px;
            background: linear-gradient(90deg, #E63946, #FF6B6B);
            transition: width 0.6s ease;
        }

        /* 场地折叠卡片 */
        .collapse-card {
            background: rgba(255, 252, 248, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
            border-radius: 16px;
        }

        /* 侧标签 */
        .side-label {
            display: inline-flex;
            align-items: center;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .side-label.attacker {
            background: rgba(230,57,70,0.10);
            color: #E63946;
        }
        .side-label.defender {
            background: rgba(104,144,240,0.10);
            color: #6890F0;
        }

        .pokemon-sprite {
            width: 50px;
            height: 50px;
            object-fit: contain;
            flex-shrink: 0;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="wechat-container mx-auto relative" style="background: #FAF8F5;">

        <!-- ══════════ 状态栏 44px ══════════ -->
        <div class="h-11 flex items-center justify-between px-4 relative z-10" style="background: #FAF8F5;">
            <div class="text-sm font-medium" style="color: #2D2D2D;">1:41</div>
            <div class="flex items-center gap-1">
                <div class="text-xs font-medium" style="color: #2D2D2D;">5G</div>
                <div class="flex items-end gap-0.5 ml-1">
                    <div class="w-1 h-1 bg-current rounded-full" style="color: #2D2D2D;"></div>
                    <div class="w-1 h-1.5 bg-current rounded-full" style="color: #2D2D2D;"></div>
                    <div class="w-1 h-2 bg-current rounded-full" style="color: #2D2D2D;"></div>
                    <div class="w-1 h-2.5 bg-current rounded-full" style="color: #2D2D2D;"></div>
                </div>
                <div class="ml-1 flex items-center" style="color: #2D2D2D;">
                    <div class="w-6 h-3 border border-current rounded-sm relative">
                        <div class="absolute inset-0.5 bg-current rounded-sm" style="width: 74%;"></div>
                    </div>
                    <div class="w-0.5 h-1.5 bg-current rounded-r-sm ml-0.5"></div>
                    <span class="text-xs ml-1">37</span>
                </div>
            </div>
        </div>

        <!-- ══════════ 内容区域 808px ══════════ -->
        <div class="relative content-area" style="background: #FAF8F5;">

            <!-- 微信胶囊按钮 -->
            <div class="absolute right-3 top-1.5 flex capsule-button rounded-full h-7 z-20" style="width: 88px;">
                <div class="flex-1 h-7 flex items-center justify-center">
                    <div class="flex gap-0.5">
                        <div class="w-1 h-1 rounded-full" style="background: #2D2D2D;"></div>
                        <div class="w-1 h-1 rounded-full" style="background: #2D2D2D;"></div>
                        <div class="w-1 h-1 rounded-full" style="background: #2D2D2D;"></div>
                    </div>
                </div>
                <div class="w-px h-4 capsule-divider self-center"></div>
                <div class="flex-1 h-7 flex items-center justify-center">
                    <div class="w-3.5 h-3.5 border rounded-full" style="border-color: #2D2D2D;"></div>
                </div>
            </div>

            <!-- 自定义导航 -->
            <div class="px-4 pt-1 pb-2">
                <div class="flex items-center h-10">
                    <!-- 返回箭头 -->
                    <div class="w-8 h-8 flex items-center justify-center -ml-1 mr-1" style="cursor: pointer;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2D2D2D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M15 18l-6-6 6-6"/>
                        </svg>
                    </div>
                    <h1 class="text-lg font-bold" style="color: #2D2D2D;">伤害计算</h1>
                </div>
            </div>

            <!-- ══════════ 全局设置行 ══════════ -->
            <div class="px-4 pb-3">
                <div class="flex items-center gap-2 flex-wrap">
                    <!-- 世代 -->
                    <div class="chip chip-active" style="font-size: 11px; padding: 3px 10px;">
                        <span>第九世代</span>
                        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="margin-left: 2px;"><path d="M6 9l6 6 6-6"/></svg>
                    </div>
                    <!-- 等级 -->
                    <div class="chip chip-inactive" style="font-size: 11px; padding: 3px 10px;">
                        Lv.50
                    </div>
                    <!-- 单打/双打 分段控件 -->
                    <div class="segment-control" style="margin-left: auto;">
                        <div class="segment-item active">单打</div>
                        <div class="segment-item">双打</div>
                    </div>
                </div>
            </div>

            <!-- ══════════ 攻击方卡片 ══════════ -->
            <div class="px-4 pb-3">
                <div class="glass-card p-4">
                    <!-- 攻击方标签 -->
                    <div class="mb-3">
                        <span class="side-label attacker">攻击方</span>
                    </div>

                    <!-- 宝可梦选择区 -->
                    <div class="flex items-center gap-3 mb-3">
                        <img src="https://s1.52poke.wiki/wiki/thumb/f/fa/445Garchomp.png/120px-445Garchomp.png"
                             alt="烈咬陆鲨" class="pokemon-sprite"
                             onerror="this.style.display='none';">
                        <div class="flex-1">
                            <div class="flex items-center gap-2 mb-1">
                                <span class="text-sm font-bold" style="color: #2D2D2D;">烈咬陆鲨</span>
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#B5B5B5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
                            </div>
                            <div class="flex gap-1">
                                <span class="type-tag type-dragon">龙</span>
                                <span class="type-tag type-ground">地面</span>
                            </div>
                        </div>
                    </div>

                    <!-- 2×2 配置网格 -->
                    <div class="grid grid-cols-2 gap-2 mb-3">
                        <div class="config-tag">
                            <span class="label">性格</span>
                            <span class="font-medium">固执</span>
                        </div>
                        <div class="config-tag">
                            <span class="label">特性</span>
                            <span class="font-medium">粗糙皮肤</span>
                        </div>
                        <div class="config-tag">
                            <span class="label">道具</span>
                            <span class="font-medium">讲究头带</span>
                        </div>
                        <div class="config-tag">
                            <span class="label">EV</span>
                            <span class="font-medium">252 Atk</span>
                        </div>
                    </div>

                    <!-- 招式槽位 -->
                    <div class="grid grid-cols-2 gap-2">
                        <!-- 槽1：地震 - 选中态 -->
                        <div class="move-slot active">
                            <div class="move-type-bar" style="background: #E0C068;"></div>
                            <span>地震</span>
                        </div>
                        <!-- 槽2：逆鳞 -->
                        <div class="move-slot">
                            <div class="move-type-bar" style="background: #7038F8;"></div>
                            <span>逆鳞</span>
                        </div>
                        <!-- 槽3：火焰拳 -->
                        <div class="move-slot">
                            <div class="move-type-bar" style="background: #F08030;"></div>
                            <span>火焰拳</span>
                        </div>
                        <!-- 槽4：剑舞 -->
                        <div class="move-slot">
                            <div class="move-type-bar" style="background: #A8A878;"></div>
                            <span>剑舞</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ══════════ 计算结果区域 ══════════ -->
            <div class="px-4 pb-3">
                <div class="result-card p-4">
                    <!-- 大字伤害百分比 -->
                    <div class="text-center mb-2">
                        <div class="font-bold" style="font-size: 22px; color: #E63946; letter-spacing: -0.5px;">
                            168.2% — 198.6%
                        </div>
                        <div class="text-sm mt-0.5" style="color: #2D2D2D; font-weight: 500;">
                            244 - 288 / 145 HP
                        </div>
                    </div>

                    <!-- 进度条 -->
                    <div class="result-bar-track mb-2">
                        <div class="result-bar-fill" style="width: 100%;"></div>
                    </div>

                    <!-- KO 描述 -->
                    <div class="text-center mb-2">
                        <span class="inline-flex items-center gap-1 px-3 py-1 rounded-full text-xs font-bold" style="background: rgba(230,57,70,0.10); color: #E63946;">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/></svg>
                            确定一击 KO
                        </span>
                    </div>

                    <!-- 完整描述 -->
                    <div class="text-center" style="font-size: 11px; color: #8A8A8A; line-height: 1.5; padding: 0 4px;">
                        252+ Atk Choice Band Garchomp Earthquake vs. 0 HP / 0 Def Pikachu
                    </div>
                </div>
            </div>

            <!-- ══════════ 防守方卡片 ══════════ -->
            <div class="px-4 pb-3">
                <div class="glass-card p-4">
                    <!-- 防守方标签 -->
                    <div class="mb-3">
                        <span class="side-label defender">防守方</span>
                    </div>

                    <!-- 宝可梦选择区 -->
                    <div class="flex items-center gap-3 mb-3">
                        <img src="https://s1.52poke.wiki/wiki/thumb/0/0d/025Pikachu.png/120px-025Pikachu.png"
                             alt="皮卡丘" class="pokemon-sprite"
                             onerror="this.style.display='none';">
                        <div class="flex-1">
                            <div class="flex items-center gap-2 mb-1">
                                <span class="text-sm font-bold" style="color: #2D2D2D;">皮卡丘</span>
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#B5B5B5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
                            </div>
                            <div class="flex gap-1">
                                <span class="type-tag type-electric">电</span>
                            </div>
                        </div>
                    </div>

                    <!-- 2×2 配置网格（防守方简略） -->
                    <div class="grid grid-cols-2 gap-2">
                        <div class="config-tag">
                            <span class="label">性格</span>
                            <span class="font-medium">胆小</span>
                        </div>
                        <div class="config-tag">
                            <span class="label">特性</span>
                            <span class="font-medium">静电</span>
                        </div>
                        <div class="config-tag">
                            <span class="label">道具</span>
                            <span class="font-medium" style="color: #B5B5B5;">无</span>
                        </div>
                        <div class="config-tag">
                            <span class="label">EV</span>
                            <span class="font-medium">0 HP / 0 Def</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ══════════ 场地设置（折叠） ══════════ -->
            <div class="px-4 pb-6">
                <div class="collapse-card px-4 py-3">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8A8A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                            </svg>
                            <span class="text-sm font-medium" style="color: #2D2D2D;">场地设置</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="text-xs" style="color: #B5B5B5;">天气：无 / 场地：无</span>
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#B5B5B5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M6 9l6 6 6-6"/>
                            </svg>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 底部安全间距 -->
            <div style="height: 24px;"></div>
        </div>
    </div>
</body>
</html>
