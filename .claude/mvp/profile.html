<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的 - Pokemon LocalDex</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    pokered: { DEFAULT: '#E63946', dark: '#C62833', light: 'rgba(230,57,70,0.08)' },
                    warm: { bg: '#FAF8F5', card: '#FFFCF8' },
                    ink: { DEFAULT: '#2D2D2D', muted: '#8A8A8A', faint: '#B5B5B5' },
                }
            }
        }
    }
    </script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
        .wechat-container { width: 393px; height: 852px; position: relative; overflow: hidden; }
        .capsule-button { background: rgba(0,0,0,0.08); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.2); }
        .capsule-divider { background: rgba(0,0,0,0.15); }
        .content-area { height: 808px; overflow-y: scroll; scroll-behavior: smooth; }
        .content-area::-webkit-scrollbar { display: none; }
        .glass-card {
            background: rgba(255, 252, 248, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
        }
        .tool-card {
            background: rgba(255, 252, 248, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
            border-radius: 16px;
            transition: transform 0.15s ease;
        }
        .tool-card:active { transform: scale(0.97); }
        .setting-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 0;
            border-bottom: 1px solid rgba(0,0,0,0.04);
        }
        .setting-row:last-child { border-bottom: none; }
        .tabbar-item { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; }
        .tabbar-item.active { color: #E63946; }
        .tabbar-item.inactive { color: #B5B5B5; }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="wechat-container mx-auto relative" style="background: #FAF8F5;">
        <!-- 状态栏 -->
        <div class="h-11 flex items-center justify-between px-4 relative z-10" style="background: #FAF8F5;">
            <div class="text-sm font-medium" style="color: #2D2D2D;">1:41</div>
            <div class="flex items-center gap-1" style="color: #2D2D2D;">
                <div class="text-xs font-medium">5G</div>
                <div class="flex items-end gap-0.5 ml-1">
                    <div class="w-1 h-1 bg-current rounded-full"></div>
                    <div class="w-1 h-1.5 bg-current rounded-full"></div>
                    <div class="w-1 h-2 bg-current rounded-full"></div>
                    <div class="w-1 h-2.5 bg-current rounded-full"></div>
                </div>
                <div class="ml-1 flex items-center">
                    <div class="w-6 h-3 border border-current rounded-sm relative">
                        <div class="absolute inset-0.5 bg-current rounded-sm" style="width: 74%;"></div>
                    </div>
                    <div class="w-0.5 h-1.5 bg-current rounded-r-sm ml-0.5"></div>
                    <span class="text-xs ml-1">37</span>
                </div>
            </div>
        </div>

        <!-- 内容区域 -->
        <div class="relative content-area" style="background: #FAF8F5;">
            <!-- 微信胶囊按钮 -->
            <div class="absolute right-3 top-1.5 flex capsule-button rounded-full h-7 z-20" style="width: 88px;">
                <div class="flex-1 h-7 flex items-center justify-center">
                    <div class="flex gap-0.5">
                        <div class="w-1 h-1 rounded-full" style="background: #2D2D2D;"></div>
                        <div class="w-1 h-1 rounded-full" style="background: #2D2D2D;"></div>
                        <div class="w-1 h-1 rounded-full" style="background: #2D2D2D;"></div>
                    </div>
                </div>
                <div class="w-px h-4 capsule-divider self-center"></div>
                <div class="flex-1 h-7 flex items-center justify-center">
                    <div class="w-3.5 h-3.5 border rounded-full" style="border-color: #2D2D2D;"></div>
                </div>
            </div>

            <!-- 导航区 -->
            <div class="px-4 pt-1 pb-3">
                <div class="flex items-center h-10">
                    <h1 class="text-xl font-bold" style="color: #2D2D2D;">我的</h1>
                </div>
            </div>

            <!-- 用户信息卡片 -->
            <div class="px-4 mb-4">
                <div class="glass-card rounded-2xl p-5">
                    <div class="flex items-center gap-4">
                        <!-- 头像 -->
                        <div class="w-16 h-16 rounded-full flex items-center justify-center flex-shrink-0" style="background: linear-gradient(135deg, #E63946 0%, #FF6B6B 100%);">
                            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"/><path d="M2 12h8M14 12h8"/><circle cx="12" cy="12" r="3" fill="white"/>
                            </svg>
                        </div>
                        <!-- 用户信息 -->
                        <div class="flex-1">
                            <h2 class="text-base font-bold mb-1" style="color: #2D2D2D;">训练家小智</h2>
                            <p class="text-xs mb-3" style="color: #8A8A8A;">目标是宝可梦大师！</p>
                            <!-- 统计数据 -->
                            <div class="flex gap-6">
                                <div class="text-center">
                                    <div class="text-base font-bold" style="color: #E63946;">3</div>
                                    <div class="text-xs" style="color: #B5B5B5;">队伍</div>
                                </div>
                                <div class="text-center">
                                    <div class="text-base font-bold" style="color: #E63946;">12</div>
                                    <div class="text-xs" style="color: #B5B5B5;">盒子</div>
                                </div>
                                <div class="text-center">
                                    <div class="text-base font-bold" style="color: #E63946;">48</div>
                                    <div class="text-xs" style="color: #B5B5B5;">收藏</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 工具入口 -->
            <div class="px-4 mb-4">
                <h3 class="text-sm font-semibold mb-3" style="color: #2D2D2D;">对战工具</h3>
                <div class="grid grid-cols-2 gap-3">
                    <!-- 伤害计算器 -->
                    <div class="tool-card p-4 flex flex-col items-center">
                        <div class="w-12 h-12 rounded-2xl flex items-center justify-center mb-2.5" style="background: rgba(230,57,70,0.08);">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#E63946" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 20V10"/><path d="M18 20V4"/><path d="M6 20v-4"/>
                            </svg>
                        </div>
                        <span class="text-sm font-medium" style="color: #2D2D2D;">伤害计算</span>
                        <span class="text-xs mt-0.5" style="color: #B5B5B5;">模拟对战伤害</span>
                    </div>
                    <!-- 属性相克 -->
                    <div class="tool-card p-4 flex flex-col items-center">
                        <div class="w-12 h-12 rounded-2xl flex items-center justify-center mb-2.5" style="background: rgba(104,144,240,0.1);">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6890F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/><path d="M9 3v18"/><path d="M15 3v18"/>
                            </svg>
                        </div>
                        <span class="text-sm font-medium" style="color: #2D2D2D;">属性相克</span>
                        <span class="text-xs mt-0.5" style="color: #B5B5B5;">18属性克制表</span>
                    </div>
                    <!-- 速度线 -->
                    <div class="tool-card p-4 flex flex-col items-center">
                        <div class="w-12 h-12 rounded-2xl flex items-center justify-center mb-2.5" style="background: rgba(52,199,89,0.1);">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#34C759" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
                            </svg>
                        </div>
                        <span class="text-sm font-medium" style="color: #2D2D2D;">速度线</span>
                        <span class="text-xs mt-0.5" style="color: #B5B5B5;">敬请期待</span>
                    </div>
                    <!-- 更多工具 -->
                    <div class="tool-card p-4 flex flex-col items-center">
                        <div class="w-12 h-12 rounded-2xl flex items-center justify-center mb-2.5" style="background: rgba(0,0,0,0.04);">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#B5B5B5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>
                            </svg>
                        </div>
                        <span class="text-sm font-medium" style="color: #2D2D2D;">更多工具</span>
                        <span class="text-xs mt-0.5" style="color: #B5B5B5;">敬请期待</span>
                    </div>
                </div>
            </div>

            <!-- 设置区域 -->
            <div class="px-4 mb-4">
                <h3 class="text-sm font-semibold mb-3" style="color: #2D2D2D;">设置</h3>
                <div class="glass-card rounded-2xl px-4">
                    <!-- 默认世代 -->
                    <div class="setting-row">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-lg flex items-center justify-center" style="background: rgba(248,208,48,0.12);">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F8D030" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="12" cy="12" r="10"/><path d="M12 8v4l2 2"/>
                                </svg>
                            </div>
                            <span class="text-sm" style="color: #2D2D2D;">默认世代</span>
                        </div>
                        <div class="flex items-center gap-1">
                            <span class="text-sm" style="color: #8A8A8A;">第九世代</span>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B5B5B5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
                        </div>
                    </div>
                    <!-- 图片质量 -->
                    <div class="setting-row">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-lg flex items-center justify-center" style="background: rgba(168,144,240,0.12);">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A890F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>
                                </svg>
                            </div>
                            <span class="text-sm" style="color: #2D2D2D;">图片质量</span>
                        </div>
                        <div class="flex items-center gap-1">
                            <span class="text-sm" style="color: #8A8A8A;">高清</span>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B5B5B5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
                        </div>
                    </div>
                    <!-- 数据缓存 -->
                    <div class="setting-row">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-lg flex items-center justify-center" style="background: rgba(230,57,70,0.08);">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#E63946" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
                                </svg>
                            </div>
                            <span class="text-sm" style="color: #2D2D2D;">清除缓存</span>
                        </div>
                        <div class="flex items-center gap-1">
                            <span class="text-sm" style="color: #8A8A8A;">23.5 MB</span>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B5B5B5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 关于区域 -->
            <div class="px-4 pb-24">
                <div class="glass-card rounded-2xl px-4">
                    <div class="setting-row">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-lg flex items-center justify-center" style="background: rgba(0,0,0,0.04);">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8A8A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>
                                </svg>
                            </div>
                            <span class="text-sm" style="color: #2D2D2D;">关于 LocalDex</span>
                        </div>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B5B5B5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
                    </div>
                    <div class="setting-row">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-lg flex items-center justify-center" style="background: rgba(0,0,0,0.04);">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8A8A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/>
                                </svg>
                            </div>
                            <span class="text-sm" style="color: #2D2D2D;">数据来源</span>
                        </div>
                        <span class="text-xs" style="color: #B5B5B5;">52Poké Wiki</span>
                    </div>
                </div>
                <!-- 版本号 -->
                <div class="text-center mt-6">
                    <p class="text-xs" style="color: #B5B5B5;">Pokemon LocalDex v1.0.0</p>
                    <p class="text-xs mt-1" style="color: #B5B5B5;">Made with ❤️ for Pokémon Trainers</p>
                </div>
            </div>
        </div>

        <!-- 底部 TabBar -->
        <div class="absolute bottom-0 left-0 right-0 flex items-end justify-around px-6 pb-5 pt-2 z-30" style="background: rgba(255,252,248,0.92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid rgba(0,0,0,0.04);">
            <div class="tabbar-item inactive">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/><path d="M2 12h8M14 12h8"/><circle cx="12" cy="12" r="3"/>
                </svg>
                <span>图鉴</span>
            </div>
            <div class="tabbar-item inactive">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
                </svg>
                <span>资料库</span>
            </div>
            <div class="tabbar-item inactive">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                </svg>
                <span>队伍</span>
            </div>
            <div class="tabbar-item active">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                </svg>
                <span>我的</span>
            </div>
        </div>
    </div>
</body>
</html>
