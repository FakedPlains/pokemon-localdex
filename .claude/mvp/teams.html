<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>队伍 - Pokemon LocalDex</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    pokered: { DEFAULT: '#E63946', dark: '#C62833', light: 'rgba(230,57,70,0.08)' },
                    warm: { bg: '#FAF8F5', card: '#FFFCF8', border: 'rgba(255,255,255,0.6)' },
                    ink: { DEFAULT: '#2D2D2D', muted: '#8A8A8A', faint: '#B5B5B5' },
                }
            }
        }
    }
    </script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
        .wechat-container { width: 393px; height: 852px; position: relative; overflow: hidden; }
        .capsule-button { background: rgba(0,0,0,0.08); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.2); }
        .capsule-divider { background: rgba(0,0,0,0.15); }
        .content-area { height: 808px; overflow-y: scroll; scroll-behavior: smooth; }
        .content-area::-webkit-scrollbar { display: none; }

        .glass-card {
            background: rgba(255, 252, 248, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
        }
        .type-tag {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 999px;
            color: white;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* 属性颜色 */
        .type-grass { background: #78C850; }
        .type-poison { background: #A040A0; }
        .type-fire { background: #F08030; }
        .type-water { background: #6890F0; }
        .type-electric { background: #F8D030; color: #2D2D2D; }
        .type-flying { background: #A890F0; }
        .type-ghost { background: #705898; }
        .type-dragon { background: #7038F8; }
        .type-ground { background: #E0C068; }
        .type-psychic { background: #F85888; }
        .type-fighting { background: #C03028; }
        .type-steel { background: #B8B8D0; }
        .type-normal { background: #A8A878; }
        .type-ice { background: #98D8D8; }

        .tabbar-item { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; }
        .tabbar-item.active { color: #E63946; }
        .tabbar-item.inactive { color: #B5B5B5; }

        /* 药丸分段控件 */
        .segment-control {
            display: flex;
            background: rgba(0, 0, 0, 0.04);
            border-radius: 999px;
            padding: 3px;
            gap: 0;
        }
        .segment-item {
            flex: 1;
            text-align: center;
            padding: 7px 16px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 500;
            color: #8A8A8A;
            transition: all 0.25s ease;
            cursor: pointer;
            position: relative;
            z-index: 1;
        }
        .segment-item.active {
            background: #E63946;
            color: white;
            box-shadow: 0 2px 8px rgba(230, 57, 70, 0.25);
        }

        /* 队伍成员网格 */
        .member-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .member-slot {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .member-avatar {
            width: 60px;
            height: 60px;
            border-radius: 14px;
            background: rgba(0, 0, 0, 0.02);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid rgba(0, 0, 0, 0.04);
        }
        .member-avatar img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .empty-slot {
            width: 60px;
            height: 60px;
            border-radius: 14px;
            border: 2px dashed rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.01);
        }

        /* 缩略队伍卡片的小圆头像 */
        .mini-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.02);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid rgba(0, 0, 0, 0.04);
        }
        .mini-avatar img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .mini-empty {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px dashed rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.01);
        }

        /* 新建队伍按钮 */
        .create-team-btn {
            background: #E63946;
            color: white;
            border: none;
            border-radius: 14px;
            padding: 14px 0;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 16px rgba(230, 57, 70, 0.3);
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .create-team-btn:active {
            transform: scale(0.98);
            box-shadow: 0 2px 8px rgba(230, 57, 70, 0.25);
        }

        /* 编辑图标 */
        .edit-icon {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.04);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
        }
        .edit-icon:active {
            background: rgba(0, 0, 0, 0.08);
        }

        /* 标签药丸 */
        .format-tag {
            font-size: 11px;
            padding: 3px 10px;
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.04);
            color: #8A8A8A;
            font-weight: 500;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="wechat-container mx-auto relative" style="background: #FAF8F5;">
        <!-- 状态栏 -->
        <div class="h-11 flex items-center justify-between px-4 relative z-10" style="background: #FAF8F5;">
            <div class="text-sm font-medium" style="color: #2D2D2D;">1:41</div>
            <div class="flex items-center gap-1">
                <div class="text-xs font-medium" style="color: #2D2D2D;">5G</div>
                <div class="flex items-end gap-0.5 ml-1">
                    <div class="w-1 h-1 bg-current rounded-full" style="color: #2D2D2D;"></div>
                    <div class="w-1 h-1.5 bg-current rounded-full" style="color: #2D2D2D;"></div>
                    <div class="w-1 h-2 bg-current rounded-full" style="color: #2D2D2D;"></div>
                    <div class="w-1 h-2.5 bg-current rounded-full" style="color: #2D2D2D;"></div>
                </div>
                <div class="ml-1 flex items-center" style="color: #2D2D2D;">
                    <div class="w-6 h-3 border border-current rounded-sm relative">
                        <div class="absolute inset-0.5 bg-current rounded-sm" style="width: 74%;"></div>
                    </div>
                    <div class="w-0.5 h-1.5 bg-current rounded-r-sm ml-0.5"></div>
                    <span class="text-xs ml-1">37</span>
                </div>
            </div>
        </div>

        <!-- 内容区域 -->
        <div class="relative content-area" style="background: #FAF8F5;">
            <!-- 微信胶囊按钮 -->
            <div class="absolute right-3 top-1.5 flex capsule-button rounded-full h-7 z-20" style="width: 88px;">
                <div class="flex-1 h-7 flex items-center justify-center">
                    <div class="flex gap-0.5">
                        <div class="w-1 h-1 rounded-full" style="background: #2D2D2D;"></div>
                        <div class="w-1 h-1 rounded-full" style="background: #2D2D2D;"></div>
                        <div class="w-1 h-1 rounded-full" style="background: #2D2D2D;"></div>
                    </div>
                </div>
                <div class="w-px h-4 capsule-divider self-center"></div>
                <div class="flex-1 h-7 flex items-center justify-center">
                    <div class="w-3.5 h-3.5 border rounded-full" style="border-color: #2D2D2D;"></div>
                </div>
            </div>

            <!-- 自定义导航区 -->
            <div class="px-4 pt-1 pb-3">
                <div class="flex items-center justify-between h-10">
                    <h1 class="text-xl font-bold" style="color: #2D2D2D;">队伍</h1>
                </div>
            </div>

            <!-- 药丸分段控件 -->
            <div class="px-4 pb-4">
                <div class="segment-control">
                    <div class="segment-item">宝可梦盒子</div>
                    <div class="segment-item active">我的队伍</div>
                </div>
            </div>

            <!-- 队伍列表 -->
            <div class="px-4 pb-32 flex flex-col gap-4">

                <!-- 队伍1 卡片 -->
                <div class="glass-card rounded-2xl p-4">
                    <!-- 队伍头部 -->
                    <div class="flex items-center justify-between mb-3">
                        <div class="flex items-center gap-2">
                            <span class="text-base font-semibold" style="color: #2D2D2D;">朱紫S1天梯队</span>
                            <span class="format-tag">单打</span>
                        </div>
                        <div class="edit-icon">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8A8A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                            </svg>
                        </div>
                    </div>

                    <!-- 成员网格 3×2 -->
                    <div class="member-grid">
                        <!-- 槽1：烈咬陆鲨 -->
                        <div class="member-slot">
                            <div class="member-avatar">
                                <img src="https://s1.52poke.wiki/wiki/thumb/f/fa/445Garchomp.png/120px-445Garchomp.png" alt="烈咬陆鲨" onerror="this.style.display='none'; this.parentElement.innerHTML='<svg width=\'28\' height=\'28\' viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'#D0CCC6\' stroke-width=\'1.5\'><circle cx=\'12\' cy=\'12\' r=\'10\'/><path d=\'M2 12h8M14 12h8\'/><circle cx=\'12\' cy=\'12\' r=\'3\'/></svg>';">
                            </div>
                            <span class="text-xs font-medium" style="color: #2D2D2D;">烈咬陆鲨</span>
                            <div class="flex gap-0.5">
                                <span class="type-tag type-dragon" style="font-size: 9px; padding: 1px 6px;">龙</span>
                                <span class="type-tag type-ground" style="font-size: 9px; padding: 1px 6px;">地面</span>
                            </div>
                        </div>

                        <!-- 槽2：路卡利欧 -->
                        <div class="member-slot">
                            <div class="member-avatar">
                                <img src="https://s1.52poke.wiki/wiki/thumb/6/63/448Lucario.png/120px-448Lucario.png" alt="路卡利欧" onerror="this.style.display='none'; this.parentElement.innerHTML='<svg width=\'28\' height=\'28\' viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'#D0CCC6\' stroke-width=\'1.5\'><circle cx=\'12\' cy=\'12\' r=\'10\'/><path d=\'M2 12h8M14 12h8\'/><circle cx=\'12\' cy=\'12\' r=\'3\'/></svg>';">
                            </div>
                            <span class="text-xs font-medium" style="color: #2D2D2D;">路卡利欧</span>
                            <div class="flex gap-0.5">
                                <span class="type-tag type-fighting" style="font-size: 9px; padding: 1px 6px;">格斗</span>
                                <span class="type-tag type-steel" style="font-size: 9px; padding: 1px 6px;">钢</span>
                            </div>
                        </div>

                        <!-- 槽3：暴鲤龙 -->
                        <div class="member-slot">
                            <div class="member-avatar">
                                <img src="https://s1.52poke.wiki/wiki/thumb/0/02/130Gyarados.png/120px-130Gyarados.png" alt="暴鲤龙" onerror="this.style.display='none'; this.parentElement.innerHTML='<svg width=\'28\' height=\'28\' viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'#D0CCC6\' stroke-width=\'1.5\'><circle cx=\'12\' cy=\'12\' r=\'10\'/><path d=\'M2 12h8M14 12h8\'/><circle cx=\'12\' cy=\'12\' r=\'3\'/></svg>';">
                            </div>
                            <span class="text-xs font-medium" style="color: #2D2D2D;">暴鲤龙</span>
                            <div class="flex gap-0.5">
                                <span class="type-tag type-water" style="font-size: 9px; padding: 1px 6px;">水</span>
                                <span class="type-tag type-flying" style="font-size: 9px; padding: 1px 6px;">飞行</span>
                            </div>
                        </div>

                        <!-- 槽4：耿鬼 -->
                        <div class="member-slot">
                            <div class="member-avatar">
                                <img src="https://s1.52poke.wiki/wiki/thumb/b/b8/094Gengar.png/120px-094Gengar.png" alt="耿鬼" onerror="this.style.display='none'; this.parentElement.innerHTML='<svg width=\'28\' height=\'28\' viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'#D0CCC6\' stroke-width=\'1.5\'><circle cx=\'12\' cy=\'12\' r=\'10\'/><path d=\'M2 12h8M14 12h8\'/><circle cx=\'12\' cy=\'12\' r=\'3\'/></svg>';">
                            </div>
                            <span class="text-xs font-medium" style="color: #2D2D2D;">耿鬼</span>
                            <div class="flex gap-0.5">
                                <span class="type-tag type-ghost" style="font-size: 9px; padding: 1px 6px;">幽灵</span>
                                <span class="type-tag type-poison" style="font-size: 9px; padding: 1px 6px;">毒</span>
                            </div>
                        </div>

                        <!-- 槽5：喷火龙 -->
                        <div class="member-slot">
                            <div class="member-avatar">
                                <img src="https://s1.52poke.wiki/wiki/thumb/7/7e/006Charizard.png/120px-006Charizard.png" alt="喷火龙" onerror="this.style.display='none'; this.parentElement.innerHTML='<svg width=\'28\' height=\'28\' viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'#D0CCC6\' stroke-width=\'1.5\'><circle cx=\'12\' cy=\'12\' r=\'10\'/><path d=\'M2 12h8M14 12h8\'/><circle cx=\'12\' cy=\'12\' r=\'3\'/></svg>';">
                            </div>
                            <span class="text-xs font-medium" style="color: #2D2D2D;">喷火龙</span>
                            <div class="flex gap-0.5">
                                <span class="type-tag type-fire" style="font-size: 9px; padding: 1px 6px;">火</span>
                                <span class="type-tag type-flying" style="font-size: 9px; padding: 1px 6px;">飞行</span>
                            </div>
                        </div>

                        <!-- 槽6：空槽位 -->
                        <div class="member-slot">
                            <div class="empty-slot">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C0BBB3" stroke-width="2" stroke-linecap="round">
                                    <path d="M12 5v14M5 12h14"/>
                                </svg>
                            </div>
                            <span class="text-xs" style="color: #B5B5B5;">添加</span>
                        </div>
                    </div>
                </div>

                <!-- 队伍2 卡片（缩略展示） -->
                <div class="glass-card rounded-2xl p-4">
                    <!-- 队伍头部 -->
                    <div class="flex items-center justify-between mb-3">
                        <div class="flex items-center gap-2">
                            <span class="text-base font-semibold" style="color: #2D2D2D;">VGC双打练习</span>
                            <span class="format-tag">双打</span>
                        </div>
                        <div class="edit-icon">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8A8A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                            </svg>
                        </div>
                    </div>

                    <!-- 成员横向缩略排列 -->
                    <div class="flex items-center gap-3">
                        <!-- 皮卡丘 -->
                        <div class="mini-avatar">
                            <img src="https://s1.52poke.wiki/wiki/thumb/0/0d/025Pikachu.png/120px-025Pikachu.png" alt="皮卡丘" onerror="this.style.display='none'; this.parentElement.innerHTML='<svg width=\'18\' height=\'18\' viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'#D0CCC6\' stroke-width=\'1.5\'><circle cx=\'12\' cy=\'12\' r=\'10\'/><path d=\'M2 12h8M14 12h8\'/><circle cx=\'12\' cy=\'12\' r=\'3\'/></svg>';">
                        </div>
                        <!-- 超梦 -->
                        <div class="mini-avatar">
                            <img src="https://s1.52poke.wiki/wiki/thumb/7/78/150Mewtwo.png/120px-150Mewtwo.png" alt="超梦" onerror="this.style.display='none'; this.parentElement.innerHTML='<svg width=\'18\' height=\'18\' viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'#D0CCC6\' stroke-width=\'1.5\'><circle cx=\'12\' cy=\'12\' r=\'10\'/><path d=\'M2 12h8M14 12h8\'/><circle cx=\'12\' cy=\'12\' r=\'3\'/></svg>';">
                        </div>
                        <!-- 快龙 -->
                        <div class="mini-avatar">
                            <img src="https://s1.52poke.wiki/wiki/thumb/7/79/149Dragonite.png/120px-149Dragonite.png" alt="快龙" onerror="this.style.display='none'; this.parentElement.innerHTML='<svg width=\'18\' height=\'18\' viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'#D0CCC6\' stroke-width=\'1.5\'><circle cx=\'12\' cy=\'12\' r=\'10\'/><path d=\'M2 12h8M14 12h8\'/><circle cx=\'12\' cy=\'12\' r=\'3\'/></svg>';">
                        </div>
                        <!-- 空槽位 -->
                        <div class="mini-empty">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#C0BBB3" stroke-width="2" stroke-linecap="round">
                                <path d="M12 5v14M5 12h14"/>
                            </svg>
                        </div>
                        <div class="mini-empty">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#C0BBB3" stroke-width="2" stroke-linecap="round">
                                <path d="M12 5v14M5 12h14"/>
                            </svg>
                        </div>
                        <div class="mini-empty">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#C0BBB3" stroke-width="2" stroke-linecap="round">
                                <path d="M12 5v14M5 12h14"/>
                            </svg>
                        </div>
                    </div>
                </div>

            </div>

            <!-- 新建队伍按钮 - 底部固定 -->
            <div class="absolute bottom-16 left-0 right-0 px-4 pb-4 z-10" style="background: linear-gradient(to top, #FAF8F5 60%, transparent);">
                <button class="create-team-btn">+ 新建队伍</button>
            </div>
        </div>

        <!-- 底部 TabBar -->
        <div class="absolute bottom-0 left-0 right-0 flex items-end justify-around px-6 pb-5 pt-2 z-30" style="background: rgba(255,252,248,0.92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid rgba(0,0,0,0.04);">
            <!-- 图鉴 -->
            <div class="tabbar-item inactive">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/><path d="M2 12h8M14 12h8"/><circle cx="12" cy="12" r="3"/>
                </svg>
                <span>图鉴</span>
            </div>
            <!-- 资料库 -->
            <div class="tabbar-item inactive">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
                </svg>
                <span>资料库</span>
            </div>
            <!-- 队伍 (active) -->
            <div class="tabbar-item active">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                </svg>
                <span>队伍</span>
            </div>
            <!-- 我的 -->
            <div class="tabbar-item inactive">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                </svg>
                <span>我的</span>
            </div>
        </div>
    </div>
</body>
</html>
