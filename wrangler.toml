# Cloudflare Pages 配置
# Worker 配置请使用 wrangler.worker.toml
# 文档：https://developers.cloudflare.com/pages/configuration/wrangler-configuration/

name = "pokemon-localdex"
pages_build_output_dir = "dist"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ── Pages Functions 绑定（/api/* 代理到 Worker） ──
[[services]]
binding = "API_WORKER"
service = "pokemon-localdex-api"

# ── 本地开发配置 ──
[dev]
port = 8788
local_protocol = "http"
