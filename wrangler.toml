# Cloudflare Workers + D1 配置
# 文档：https://developers.cloudflare.com/workers/wrangler/configuration/

name = "pokemon-localdex-api"
main = "apps/api/src/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# ── D1 数据库绑定 ──
[[d1_databases]]
binding = "DB"
database_name = "pokemon-localdex-d1"
database_id = "ebd4055f-ab56-4183-b95e-5056f0b500f3"

# ── 静态资源（Cloudflare Pages 模式） ──
# 当通过 Pages 部署时，ASSETS 绑定由 Pages 自动注入
# 本地开发时可通过 wrangler pages dev 模拟

# ── 环境变量 ──
[vars]
DATA_SOURCE = "d1"

# ── 本地开发配置 ──
[dev]
port = 8787
local_protocol = "http"

# ── 生产环境（可选：覆盖变量） ──
[env.production]
name = "pokemon-localdex-api"
vars = { DATA_SOURCE = "d1" }

[[env.production.d1_databases]]
binding = "DB"
database_name = "pokemon-localdex-d1"
database_id = "ebd4055f-ab56-4183-b95e-5056f0b500f3"
