# Cloudflare Workers 专用配置（不含 pages_build_output_dir）
# 用法：wrangler deploy --config wrangler.worker.toml

name = "pokemon-localdex-api"
main = "apps/api/src/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[placement]
mode = "smart"

[[d1_databases]]
binding = "DB"
database_name = "pokemon-localdex-d1"
database_id = "ebd4055f-ab56-4183-b95e-5056f0b500f3"

[vars]
DATA_SOURCE = "d1"

[env.production]
name = "pokemon-localdex-api"
vars = { DATA_SOURCE = "d1" }

[env.production.placement]
mode = "smart"

[[env.production.d1_databases]]
binding = "DB"
database_name = "pokemon-localdex-d1"
database_id = "ebd4055f-ab56-4183-b95e-5056f0b500f3"
