<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokemon LocalDex</title>
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="hero">
        <div class="hero-copy">
          <p class="eyebrow">Local Pokedex Workspace</p>
          <h1>Pokemon LocalDex</h1>
          <p class="hero-text">
            本地图鉴、道具资料、队伍构筑与伤害计算的统一入口。当前数据来源于 52Poké，并优先读取本地 SQLite。
          </p>
        </div>
        <nav class="hero-nav">
          <a href="#/pokedex" data-nav>图鉴</a>
          <a href="#/items" data-nav>道具</a>
          <a href="#/moves" data-nav>招式</a>
          <a href="#/abilities" data-nav>特性</a>
          <a href="#/teams" data-nav>队伍</a>
          <a href="#/damage" data-nav>伤害</a>
        </nav>
      </header>
      <main id="app" class="main-panel"></main>
    </div>

    <template id="loading-template">
      <section class="panel loading-panel">
        <div class="pulse-dot"></div>
        <p>资料加载中…</p>
      </section>
    </template>

    <script type="module" src="assets/app.js"></script>
  </body>
</html>
